<section class="hero">
        <video class="bg-video" autoplay loop muted playsinline preload="auto" poster="assets/imagenes/fondo-poster.png">
            <source src="assets/fondo.mp4" type="video/mp4">
        </video>

        <div class="hero-content">
            <h1>Bienvenido a La Norma Express</h1>
            <p>Encuentra información sobre Derecho Civil, Penal y Constitucional.</p>
            <div class="search-box">
                <input type="text" id="buscador-principal" placeholder="¿Qué tema legal buscas hoy?" autocomplete="off">
                <button id="btn-buscar-principal">Buscar</button>
                <div id="buscador-sugerencias" class="sugerencias-box" style="display: none;"></div>
            </div>
        </div>
    </section>

    <section class="container">
        <h2 style="margin-bottom: 25px;">Constitución, códigos y leyes.</h2>
        <div id="legislacion-home-cards" class="grid-categorias"></div>

    </section>

    <script>
        {
            let searchIndex = [];
            let databasesLoaded = false;

            const legislationCards = document.getElementById('legislacion-home-cards');
            if (legislationCards) {
                window.LNENormas.all.forEach(norma => {
                    if (!norma.homeCard) return;

                    const card = document.createElement('a');
                    card.href = norma.url;
                    card.className = 'card';
                    card.style.cssText = 'text-decoration: none; color: inherit; display: block;';
                    card.innerHTML = `
                        <img src="${norma.homeCard.image}" alt="${norma.homeCard.imageAlt}" class="icono-rama">
                        <h3>${norma.homeCard.title}</h3>
                        <p>${norma.homeCard.description}</p>
                    `;
                    legislationCards.appendChild(card);
                });
            }

            async function loadSearchDatabases() {
                if (databasesLoaded) return;
                try {
                    // Cargar JSON de cursos
                    const [laboral, tributario, penal] = await Promise.all([
                        fetch('data/laboral.json').then(r => r.json()).catch(() => []),
                        fetch('data/tributario.json').then(r => r.json()).catch(() => []),
                        fetch('data/penal.json').then(r => r.json()).catch(() => [])
                    ]);

                    // Contratos estáticos
                    const contratos = [
                        { id: 1, titulo: "Teoría General del Contrato", contenido: "El contrato es un acuerdo de voluntades entre dos o más partes que produce consecuencias jurídicas." },
                        { id: 2, titulo: "Contrato de Compraventa", contenido: "Análisis exhaustivo del contrato de compraventa, sus características, obligaciones del vendedor y del comprador." },
                        { id: 3, titulo: "Contrato de Arrendamiento", contenido: "Estudio detallado del arrendamiento. Derechos y obligaciones del arrendador y arrendatario, resolución de contrato." },
                        { id: 4, titulo: "Prestación de Servicios", contenido: "Régimen legal aplicable a la locación de servicios, diferencias con el contrato de trabajo, honorarios." },
                        { id: 5, titulo: "Contrato de Obra", contenido: "Reglas principales sobre la ejecución de obras, la responsabilidad del contratista, plazos y riesgos." },
                        { id: 6, titulo: "Contratos Modernos", contenido: "Módulo sobre contratos atípicos: Leasing, Factoring, Franchising, Joint Venture y Know How." }
                    ];

                    // Insertar cursos en índice
                    laboral.forEach(c => searchIndex.push({
                        tipo: 'curso',
                        curso: 'laboral',
                        id: c.id,
                        titulo: c.titulo,
                        contenido: c.contenido || '',
                        textoBusqueda: `curso de laboral - ${c.titulo} - ${c.contenido || ''}`.toLowerCase()
                    }));

                    tributario.forEach(c => searchIndex.push({
                        tipo: 'curso',
                        curso: 'tributario',
                        id: c.id,
                        titulo: c.titulo,
                        contenido: c.contenido || '',
                        textoBusqueda: `curso de tributario especial - ${c.titulo} - ${c.contenido || ''}`.toLowerCase()
                    }));

                    penal.forEach(c => searchIndex.push({
                        tipo: 'curso',
                        curso: 'penal-economico',
                        id: c.id,
                        titulo: c.titulo,
                        contenido: c.contenido || '',
                        textoBusqueda: `curso de penal economico - ${c.titulo} - ${c.contenido || ''}`.toLowerCase()
                    }));

                    contratos.forEach(c => searchIndex.push({
                        tipo: 'curso',
                        curso: 'contratos',
                        id: c.id,
                        titulo: c.titulo,
                        contenido: c.contenido || '',
                        textoBusqueda: `curso de contratos - ${c.titulo} - ${c.contenido || ''}`.toLowerCase()
                    }));

                    // Cargar e indexar las normas registradas centralmente
                    const registeredNorms = window.LNENormas.all;
                    const normData = await Promise.all(
                        registeredNorms.map(norma => window.LNELegislacion.loadNormData(norma))
                    );

                    registeredNorms.forEach((norma, index) => {
                        const sections = normData[index];
                        if (!Array.isArray(sections)) return;

                        sections.forEach(seccion => {
                            if (!Array.isArray(seccion.articulos)) return;
                            seccion.articulos.forEach(art => {
                                searchIndex.push({
                                    tipo: 'ley',
                                    normaId: norma.id,
                                    route: norma.url,
                                    badge: norma.searchBadge || { className: '', label: norma.menuLabel || norma.title },
                                    numero: art.numero,
                                    titulo: art.titulo || '',
                                    contenido: art.texto || '',
                                    textoBusqueda: `${norma.searchTerms || norma.title} articulo ${art.numero} ${art.titulo || ''} ${art.texto || ''}`.toLowerCase()
                                });
                            });
                        });
                    });

                    databasesLoaded = true;
                    console.log("Autocomplete indexed successfully:", searchIndex.length, "items.");
                } catch (err) {
                    console.error("Error cargando bases de datos de búsqueda:", err);
                }
            }

            const input = document.getElementById('buscador-principal');
            const suggestionsBox = document.getElementById('buscador-sugerencias');
            const btnBuscar = document.getElementById('btn-buscar-principal');

            if (input) {
                // Iniciar carga en background a los 500ms
                setTimeout(loadSearchDatabases, 500);

                input.addEventListener('focus', loadSearchDatabases);
                input.addEventListener('input', () => {
                    const query = input.value.trim();
                    if (query.length < 2) {
                        ocultarSugerencias();
                        return;
                    }
                    if (!databasesLoaded) {
                        loadSearchDatabases();
                        return;
                    }
                    buscarYMostrar(query);
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        ejecutarBusqueda();
                    }
                });
            }

            if (btnBuscar) {
                btnBuscar.addEventListener('click', ejecutarBusqueda);
            }

            function buscarYMostrar(query) {
                const cleanQuery = query.toLowerCase().trim();
                const tokens = cleanQuery.split(/\s+/);
                
                // Buscar coincidencia por número de artículo específico si se escribe "articulo X"
                let artNumMatch = cleanQuery.match(/^(?:articulo|artículo|art\.?)\s+(\w+)/i);
                let targetArtNum = artNumMatch ? artNumMatch[1] : null;

                const matches = searchIndex.filter(item => {
                    if (targetArtNum && item.tipo === 'ley') {
                        return item.numero.toLowerCase() === targetArtNum.toLowerCase();
                    }
                    return tokens.every(token => item.textoBusqueda.includes(token));
                });

                // Ordenar: artículos exactos o coincidencias en título primero
                matches.sort((a, b) => {
                    if (targetArtNum) {
                        const aMatch = a.numero && a.numero.toLowerCase() === targetArtNum.toLowerCase();
                        const bMatch = b.numero && b.numero.toLowerCase() === targetArtNum.toLowerCase();
                        if (aMatch && !bMatch) return -1;
                        if (!aMatch && bMatch) return 1;
                    }
                    const aTitleMatch = a.titulo.toLowerCase().includes(cleanQuery);
                    const bTitleMatch = b.titulo.toLowerCase().includes(cleanQuery);
                    if (aTitleMatch && !bTitleMatch) return -1;
                    if (!aTitleMatch && bTitleMatch) return 1;
                    return 0;
                });

                renderSuggestions(matches);
            }

            function renderSuggestions(matches) {
                if (!suggestionsBox) return;
                if (matches.length === 0) {
                    suggestionsBox.innerHTML = `<div class="sugerencia-sin-resultados">No se encontraron resultados para tu búsqueda.</div>`;
                    suggestionsBox.style.display = 'block';
                    return;
                }

                suggestionsBox.innerHTML = '';
                matches.slice(0, 10).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'sugerencia-item';

                    let badgeHtml = '';
                    if (item.tipo === 'ley') {
                        badgeHtml = `<span class="badge ${item.badge.className}">${item.badge.label}</span>`;
                    } else {
                        if (item.curso === 'laboral') badgeHtml = `<span class="badge badge-laboral">Laboral</span>`;
                        else if (item.curso === 'tributario') badgeHtml = `<span class="badge badge-tributario">Tributario</span>`;
                        else if (item.curso === 'penal-economico') badgeHtml = `<span class="badge badge-penal-eco">Penal Eco.</span>`;
                        else if (item.curso === 'contratos') badgeHtml = `<span class="badge badge-contratos">Contratos</span>`;
                    }

                    let titleText = item.tipo === 'ley' ? `Artículo ${item.numero}: ${item.titulo}` : item.titulo;
                    let rawContent = item.contenido.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
                    let snippet = rawContent.substring(0, 85) + (rawContent.length > 85 ? '...' : '');

                    div.innerHTML = `
                        <div class="sugerencia-header">
                            ${badgeHtml}
                            <span class="sugerencia-titulo">${titleText}</span>
                        </div>
                        <div class="sugerencia-snippet">${snippet}</div>
                    `;

                    div.addEventListener('click', () => {
                        if (item.tipo === 'ley') {
                            window.LNERouter.navigate(`${item.route}?art=${encodeURIComponent(item.numero)}`);
                        } else {
                            window.LNERouter.navigate(`${window.LNERouter.getCourseUrl(item.curso)}?class=${item.id}`);
                        }
                        ocultarSugerencias();
                        if (input) input.value = '';
                    });

                    suggestionsBox.appendChild(div);
                });

                suggestionsBox.style.display = 'block';
            }

            function ejecutarBusqueda() {
                if (!input) return;
                const query = input.value.trim();
                if (!query) return;

                const cleanQuery = query.toLowerCase();
                const tokens = cleanQuery.split(/\s+/);

                const matches = searchIndex.filter(item => tokens.every(token => item.textoBusqueda.includes(token)));
                if (matches.length > 0) {
                    const firstMatch = matches[0];
                    if (firstMatch.tipo === 'ley') {
                        window.LNERouter.navigate(`${firstMatch.route}?art=${encodeURIComponent(firstMatch.numero)}`);
                    } else {
                        window.LNERouter.navigate(`${window.LNERouter.getCourseUrl(firstMatch.curso)}?class=${firstMatch.id}`);
                    }
                    input.value = '';
                    ocultarSugerencias();
                }
            }

            function ocultarSugerencias() {
                if (suggestionsBox) {
                    suggestionsBox.style.display = 'none';
                }
            }

            document.addEventListener('click', (e) => {
                const searchBox = document.querySelector('.search-box');
                if (searchBox && !searchBox.contains(e.target)) {
                    ocultarSugerencias();
                }
            });
        }
    </script>
