<section class="hero">
        <video class="bg-video" autoplay loop muted playsinline preload="auto" poster="assets/imagenes/fondo-poster.png">
            <source src="assets/fondo.mp4" type="video/mp4">
        </video>

        <div class="hero-content">
            <h1>Bienvenido a La Norma Express</h1>
            <p>Encuentra información sobre Derecho Civil, Penal y Constitucional.</p>
            <div class="search-box">
                <input type="text" id="buscador-principal" placeholder="¿Qué tema legal buscas hoy?" autocomplete="off">
                <button id="btn-buscar-principal">Buscar</button>
                <div id="buscador-sugerencias" class="sugerencias-box" style="display: none;"></div>
            </div>
        </div>
    </section>

    <section class="container">
        <h2 style="margin-bottom: 25px;">Constitución, códigos y leyes.</h2>
        <div id="legislacion-home-cards" class="grid-categorias"></div>

    </section>

    <script>
        {
            const SEARCH_SUGGESTION_LIMIT = 5;
            const SEARCH_DEBOUNCE_MS = 120;
            let visibleResults = [];
            let activeResultIndex = -1;
            let debounceTimer = null;

            if (window.LNEHomeSearchController) window.LNEHomeSearchController.abort();
            const searchController = new AbortController();
            window.LNEHomeSearchController = searchController;
            const { signal } = searchController;

            const legislationCards = document.getElementById('legislacion-home-cards');
            if (legislationCards) {
                window.LNENormas.all.forEach(norma => {
                    if (!norma.homeCard) return;

                    const card = document.createElement('a');
                    card.href = norma.url;
                    card.className = 'card';
                    card.style.cssText = 'text-decoration: none; color: inherit; display: block;';
                    card.innerHTML = `
                        <img src="${norma.homeCard.image}" alt="${norma.homeCard.imageAlt}" class="icono-rama">
                        <h3>${norma.homeCard.title}</h3>
                        <p>${norma.homeCard.description}</p>
                    `;
                    legislationCards.appendChild(card);
                });
            }

            function normalizeSearchText(value) {
                return String(value || '')
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .toLowerCase()
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            function plainText(value) {
                return String(value || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            }

            const searchIndex = [
                ...window.LNENormas.all.map(norma => {
                    const name = plainText(norma.documentHeading || norma.menuLabel || norma.title);
                    return {
                        type: 'norma',
                        name,
                        normalizedName: normalizeSearchText(name),
                        aliases: [norma.title, norma.menuLabel, norma.searchTerms, norma.id, norma.slug, ...(norma.legacyPaths || [])]
                            .map(normalizeSearchText)
                            .filter(Boolean),
                        route: norma.url
                    };
                }),
                ...window.LNEFormacion.courses.map(course => ({
                    type: 'curso',
                    name: course.name,
                    normalizedName: normalizeSearchText(course.name),
                    aliases: [course.id, course.slug, ...(course.legacyPaths || [])]
                        .map(normalizeSearchText)
                        .filter(Boolean),
                    route: course.route
                }))
            ];

            const input = document.getElementById('buscador-principal');
            const suggestionsBox = document.getElementById('buscador-sugerencias');
            const btnBuscar = document.getElementById('btn-buscar-principal');

            if (input && suggestionsBox) {
                input.setAttribute('role', 'combobox');
                input.setAttribute('aria-autocomplete', 'list');
                input.setAttribute('aria-controls', 'buscador-sugerencias');
                input.setAttribute('aria-expanded', 'false');
                suggestionsBox.setAttribute('role', 'listbox');
            }

            function nameRelevance(normalizedName, query) {
                if (normalizedName === query) return 0;
                if (normalizedName.startsWith(query)) return 100 + normalizedName.length;

                const words = normalizedName.split(' ');
                const wordIndex = words.findIndex(word => word.startsWith(query));
                if (wordIndex >= 0) return 200 + wordIndex * 10 + normalizedName.length;

                const containedAt = normalizedName.indexOf(query);
                if (containedAt >= 0) return 300 + containedAt + normalizedName.length;
                return Number.POSITIVE_INFINITY;
            }

            function itemRelevance(item, query) {
                const primaryScore = nameRelevance(item.normalizedName, query);
                if (Number.isFinite(primaryScore)) return primaryScore;

                const aliasScore = item.aliases.reduce((best, alias) => {
                    return Math.min(best, nameRelevance(alias, query));
                }, Number.POSITIVE_INFINITY);
                return Number.isFinite(aliasScore) ? 1000 + aliasScore : aliasScore;
            }

            function findResults(query) {
                const normalizedQuery = normalizeSearchText(query);
                if (!normalizedQuery) return [];

                return searchIndex
                    .map(item => ({ item, score: itemRelevance(item, normalizedQuery) }))
                    .filter(result => Number.isFinite(result.score))
                    .sort((a, b) => a.score - b.score || a.item.name.localeCompare(b.item.name, 'es', { sensitivity: 'base' }))
                    .slice(0, SEARCH_SUGGESTION_LIMIT)
                    .map(result => result.item);
            }

            function updateActiveResult(nextIndex) {
                const rows = Array.from(suggestionsBox.querySelectorAll('.sugerencia-item'));
                if (!rows.length) {
                    activeResultIndex = -1;
                    return;
                }

                activeResultIndex = (nextIndex + rows.length) % rows.length;
                rows.forEach((row, index) => {
                    const active = index === activeResultIndex;
                    row.classList.toggle('is-active', active);
                    row.setAttribute('aria-selected', String(active));
                });
                input.setAttribute('aria-activedescendant', rows[activeResultIndex].id);
            }

            function hideSuggestions() {
                visibleResults = [];
                activeResultIndex = -1;
                suggestionsBox.replaceChildren();
                suggestionsBox.style.display = 'none';
                input.setAttribute('aria-expanded', 'false');
                input.removeAttribute('aria-activedescendant');
            }

            function openResult(item) {
                if (!item) return;
                input.value = '';
                hideSuggestions();
                window.LNERouter.navigate(item.route);
            }

            function renderSuggestions(results) {
                visibleResults = results;
                suggestionsBox.replaceChildren();
                activeResultIndex = -1;

                if (!results.length) {
                    hideSuggestions();
                    return;
                }

                results.forEach((item, index) => {
                    const row = document.createElement('button');
                    row.type = 'button';
                    row.id = `buscador-opcion-${index}`;
                    row.className = 'sugerencia-item';
                    row.setAttribute('role', 'option');
                    row.setAttribute('aria-selected', 'false');
                    row.textContent = item.name;
                    row.addEventListener('mouseenter', () => updateActiveResult(index), { signal });
                    row.addEventListener('click', () => openResult(item), { signal });
                    suggestionsBox.appendChild(row);
                });

                suggestionsBox.style.display = 'block';
                input.setAttribute('aria-expanded', 'true');
            }

            function refreshSuggestions() {
                renderSuggestions(findResults(input.value));
            }

            input.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                if (!normalizeSearchText(input.value)) {
                    hideSuggestions();
                    return;
                }
                debounceTimer = setTimeout(refreshSuggestions, SEARCH_DEBOUNCE_MS);
            }, { signal });

            input.addEventListener('focus', () => {
                if (normalizeSearchText(input.value)) refreshSuggestions();
            }, { signal });

            input.addEventListener('keydown', event => {
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    if (!visibleResults.length) refreshSuggestions();
                    if (visibleResults.length) updateActiveResult(activeResultIndex + 1);
                } else if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    if (!visibleResults.length) refreshSuggestions();
                    if (visibleResults.length) updateActiveResult(activeResultIndex < 0 ? visibleResults.length - 1 : activeResultIndex - 1);
                } else if (event.key === 'Enter' && activeResultIndex >= 0) {
                    event.preventDefault();
                    openResult(visibleResults[activeResultIndex]);
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    hideSuggestions();
                }
            }, { signal });

            btnBuscar.addEventListener('click', () => {
                const [firstResult] = findResults(input.value);
                if (firstResult) openResult(firstResult);
            }, { signal });

            document.addEventListener('click', event => {
                const searchBox = document.querySelector('.search-box');
                if (searchBox && !searchBox.contains(event.target)) hideSuggestions();
            }, { signal });
        }
    </script>
