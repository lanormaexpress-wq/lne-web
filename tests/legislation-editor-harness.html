<!doctype html>
<meta charset="utf-8">
<title>Prueba aislada del editor de legislación</title>
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0}</style>
<output id="payload" hidden></output><iframe id="editor" src="/admin/converter-workspace?mode=legislation" title="Prueba del editor"></iframe>
<script>
const frame=document.getElementById('editor');
const rows=Array.from({length:80},(_,index)=>({
 id:index+1,numero_articulo:String(index+1),titulo:`Artículo de prueba ${index+1}`,contenido:`<div>Contenido jurídico ${index+1}.</div>`,orden:index+1,contenido_lne:{tipo:'Artículo'},estructura:{seccion:{titulo:'TÍTULO PRELIMINAR',capitulo:'',nuevaHoja:false}}
}));
const norma={codigo:'codigo-civil',nombre:'Código Civil',introduccion:'La legislación civil regula las relaciones jurídicas de las personas.'};
let initialSent=false,appendSent=false;
function sendInitial(){if(initialSent)return;initialSent=true;frame.contentWindow.postMessage({type:'lne-legislation-load',reset:true,norma,rows:rows.slice(0,40)},location.origin)}
frame.addEventListener('load',sendInitial);
window.addEventListener('message',event=>{
 if(event.origin!==location.origin)return;
 if(event.data?.type==='lne-legislation-bridge-ready')sendInitial();
 if(event.data?.type==='lne-legislation-ready'&&event.data.loaded===40&&!appendSent){appendSent=true;frame.contentWindow.postMessage({type:'lne-legislation-load',reset:false,norma,rows:rows.slice(40)},location.origin)}
 if(event.data?.type==='lne-legislation-publish'){window.__lastPublish=event.data;document.getElementById('payload').textContent=JSON.stringify(event.data)}
});
</script>
